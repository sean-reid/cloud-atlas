name: ingest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      adapters:
        description: Space-separated adapter ids; empty runs the schedule for this hour
        required: false
        default: ""
      import:
        description: Also import the reviewed CSVs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  # Optional, read-only credentials for the probes that need an account. Unset means skipped.
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
  OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
  OCI_USER: ${{ secrets.OCI_USER }}
  OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
  OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
  OCI_REGION: ${{ secrets.OCI_REGION }}
  ALIBABA_ACCESS_KEY_ID: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
  ALIBABA_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
  TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
  TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The cron and a deploy can overlap; applying migrations here means an ingest never meets a
      # table its code expects and the database lacks.
      - uses: ./.github/actions/d1-migrate
      - name: pick adapters for this hour
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.adapters }}
        run: |
          if [ -n "$REQUESTED" ]; then echo "adapters=$REQUESTED" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A manual run with no list means everything; the cron runs the hourly adapters except at 05:00 UTC.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "05" ]; then
            echo "adapters=" >> "$GITHUB_OUTPUT"
          else
            echo "adapters=--schedule hourly" >> "$GITHUB_OUTPUT"
          fi
      - name: import reviewed CSVs
        if: github.event.inputs.import == 'true' || steps.pick.outputs.adapters == ''
        run: npx tsx pipeline/cli.ts import --remote
      - name: ingest
        run: npx tsx pipeline/cli.ts ingest ${{ steps.pick.outputs.adapters }} --remote
      - name: collapse hourly signals older than 90 days
        if: steps.pick.outputs.adapters == ''
        run: npx tsx pipeline/cli.ts retain --remote
