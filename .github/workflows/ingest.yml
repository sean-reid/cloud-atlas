name: ingest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      adapters:
        description: Space-separated adapter ids; empty runs the schedule for this hour
        required: false
        default: ""
      import:
        description: Also import the reviewed CSVs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: pick adapters for this hour
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.adapters }}
        run: |
          if [ -n "$REQUESTED" ]; then echo "adapters=$REQUESTED" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date -u +%H)" = "05" ]; then
            echo "adapters=" >> "$GITHUB_OUTPUT"
          else
            echo "adapters=azure-retail-prices aws-spot-advisor" >> "$GITHUB_OUTPUT"
          fi
      - name: import reviewed CSVs
        if: github.event.inputs.import == 'true' || steps.pick.outputs.adapters == ''
        run: npx tsx pipeline/cli.ts import --remote
      - name: ingest
        run: npx tsx pipeline/cli.ts ingest ${{ steps.pick.outputs.adapters }} --remote
