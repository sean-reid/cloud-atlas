name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloud-atlas.dwainosaur.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: require the deploy token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in Actions secrets"
            exit 1
          fi
      - run: npm run build
      - name: ensure the D1 database exists and pin its id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "cloud-atlas") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create cloud-atlas >/dev/null
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "cloud-atlas") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply cloud-atlas --remote
      - run: npx wrangler deploy
      - name: smoke
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://cloud-atlas.seanreid.workers.dev/api/health | grep -q '"ok":true'
          # The custom domain needs DNS and a certificate on first deploy, which can take minutes.
          curl -fsS --retry 18 --retry-all-errors --retry-delay 10 https://cloud-atlas.dwainosaur.com/ | grep -qi cloud-atlas
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://cloud-atlas.dwainosaur.com/api/health | grep -q '"ok":true'
