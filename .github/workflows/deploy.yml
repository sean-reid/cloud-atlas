name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloud-atlas.dwainosaur.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: require the deploy token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in Actions secrets"
            exit 1
          fi
      - run: npm run build
      - uses: ./.github/actions/d1-migrate
      - run: npx wrangler deploy
      - name: smoke
        run: |
          # Prints status and body on a miss, so a failure here says what the edge actually served.
          check() {
            local url="$1" want="$2" tries="$3" delay="$4" body code
            for i in $(seq 1 "$tries"); do
              body=$(curl -sS -w '\n%{http_code}' --max-time 20 "$url" 2>&1) || true
              code=${body##*$'\n'}
              if [ "$code" = "200" ] && printf '%s' "$body" | grep -qi -- "$want"; then echo "ok $url"; return 0; fi
              sleep "$delay"
            done
            echo "::error::$url answered $code without '$want'"; printf '%s\n' "$body" | head -c 600; echo
            return 1
          }
          check https://cloud-atlas.seanreid.workers.dev/api/health '"ok":true' 6 5
          check https://cloud-atlas.dwainosaur.com/ 'Cloud Atlas' 18 10
          check https://cloud-atlas.dwainosaur.com/api/health '"ok":true' 6 5
